
dataset: shapenet
data_dir: data/shapenet_part_seg_hdf5_data
num_points: 2048
num_classes: 50
num_categories: 16
use_category: true

num_slices: 16
points_per_slice: 128
geo_dim: 8

use_multiscale: true
num_slices_fine: 64
points_per_slice_fine: 32
fine_feat_dim: 128
fine_k_edge: 8

feat_dim: 512
k_edge: 20
transformer_heads: 4
transformer_ffn_dim: 1024
hidden_dim: 512
num_lif_layers: 3
lif_leak: 0.9
lif_threshold: 1.0
d_ssp: 128
T: 6
point_feat_dim: 64

encoder_type: spiking
encoder_T: 4
encoder_lif_leak: 0.9
encoder_lif_threshold: 1.0

warm_start_from: null

seg_head_type: spiking
seg_head_T: 2
seg_head_lif_leak: 0.9
seg_head_lif_threshold: 1.0

ssp_mode: learned

cat_emb_dim: 8

lif_learnable: true
lif_use_mpbn: true

loss_mode: dense_tet
tet_lambda: 0.05

use_soft_fp: true
fp_k: 3
fp_epsilon: 1e-8

use_boundary_aware: true
boundary_hidden: 128
bnd_k: 10
bnd_loss_weight: 0.1

epochs: 300
batch_size: 32
lr: 3e-4
encoder_lr_scale: 0.2
weight_decay: 0.01
grad_clip: 1.0
warmup_epochs: 25
use_amp: true

tau_start: 1.0
tau_end: 0.1
tau_decay: 0.95

aug_rotate_z: true
aug_rotate_so3: false
aug_so3_tilt: 0.26

aug_scale_lo: 0.66
aug_scale_hi: 1.5

aug_translate: 0.1

aug_jitter_sigma: 0.005
aug_jitter_clip: 0.02

aug_flip_x: true
aug_flip_y: true
aug_flip_z: false

eval_interval: 5
log_dir: logs
ckpt_dir: checkpoints
seed: 42
num_workers: 8