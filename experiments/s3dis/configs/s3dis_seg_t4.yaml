
dataset: s3dis
data_dir: data/s3dis
num_points: 4096
num_classes: 13
use_category: false
test_area: 5
block_size: 1.0
use_rgb: true
use_height: true
epoch_len: 3000
input_channels: 7

num_slices: 16
points_per_slice: 128
geo_dim: 8

feat_dim: 256
k_edge: 16
transformer_heads: 4
transformer_ffn_dim: 512
hidden_dim: 256
num_lif_layers: 2
lif_leak: 0.9
lif_threshold: 1.0
d_ssp: 64
T: 4
point_feat_dim: 32

epochs: 100
batch_size: 8
lr: 0.001
weight_decay: 0.01
grad_clip: 1.0
warmup_epochs: 5
use_amp: true
use_class_weights: true

tau_start: 1.0
tau_end: 0.1
tau_decay: 0.95

aug_rotate_z: true
aug_scale_lo: 0.8
aug_scale_hi: 1.25
aug_translate: 0.1
aug_jitter_sigma: 0.005
aug_jitter_clip: 0.02
aug_color_drop: 0.2
aug_color_jitter: 0.05
aug_color_bright: 0.1
aug_global_point_dropout: 0.1
aug_elastic: false

aug_pointwolf: true
aug_pointwolf_num_anchors: 4
aug_pointwolf_radius: 0.4
aug_pointwolf_scale_lo: 0.75
aug_pointwolf_scale_hi: 1.25

aug_cutmix: true
aug_cutmix_prob: 0.5


spike_dropout: 0.1

kd_teacher_epochs: 30
kd_temp: 4.0
kd_lam: 0.5

eval_interval: 5
log_dir: logs
ckpt_dir: checkpoints
seed: 42
num_workers: 0
